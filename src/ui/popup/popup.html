<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>FireSync</title>
    <link rel="stylesheet" href="theme.css" />
    <style>
      body { width: 340px; }
      header { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--fs-border); }
      main { padding: 12px 14px; }
      .status { font-size: 12px; color: var(--fs-text-dim); }
      ul { list-style: none; margin: 10px 0 0; padding: 0; max-height: 232px; overflow-y: auto; }
      li { display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 8px; }
      li:hover { background: var(--fs-bg-sunken); }
      .user { font-weight: 600; }
      .origin { font-size: 11px; color: var(--fs-text-dim); }
      .grow { flex: 1; min-width: 0; }
      .grow > div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      header .status { white-space: pre-line; line-height: 1.35; }
      footer { padding: 10px 14px; border-top: 1px solid var(--fs-border); display: flex; gap: 8px; }
      .version {
        display: flex; align-items: center; gap: 8px;
        padding: 7px 14px 9px; border-top: 1px solid var(--fs-border);
        font-size: 11px; color: var(--fs-text-dim); background: var(--fs-bg-sunken);
      }
      .version a { color: inherit; }
      /* `hidden` is only display:none from the UA sheet, so any inline or
         class display would silently beat it. Keep the rule explicit. */
      [hidden] { display: none !important; }
      .update-banner {
        display: flex; gap: 8px; align-items: center; padding: 9px 14px;
        border-bottom: 1px solid var(--fs-border); background: var(--fs-bg-sunken);
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <header>
      <span class="fs-brand__mark"></span>
      <div class="grow">
        <div style="font-weight:650">FireSync</div>
        <div class="status" id="status">Checking…</div>
      </div>
      <button class="ghost" id="lock" title="Lock the vault">Lock</button>
    </header>
    <div id="update-banner" class="update-banner" hidden>
      <span class="grow" id="update-banner-text"></span>
      <a id="update-banner-link" target="_blank" rel="noreferrer">Get it</a>
      <button class="ghost" id="update-banner-dismiss" aria-label="Dismiss">✕</button>
    </div>
    <main>
      <section id="site-panel" hidden>
        <div class="site-head">
          <span class="grow" id="site-origin"></span>
          <button class="ghost" id="site-toggle" aria-expanded="false"
                  title="Preferences that apply only to this site">Site settings</button>
        </div>
        <ul id="site-list"></ul>
        <div id="site-empty" class="muted" hidden>No saved logins for this site.</div>
        <div id="site-prefs" hidden>
          <label class="site-pref">
            <input type="checkbox" id="site-autofill" />
            <span>Fill automatically on page load</span>
          </label>
          <label class="site-pref">
            <input type="checkbox" id="site-neversave" />
            <span>Never offer to save logins here</span>
          </label>
          <label class="site-pref">
            <span class="grow">Inline menu</span>
            <select id="site-inlinemenu">
              <option value="">Use the global setting</option>
              <option value="on">On</option>
              <option value="iconOnly">Icon only</option>
              <option value="off">Off</option>
            </select>
          </label>
          <label class="site-pref">
            <span class="grow">URI match</span>
            <select id="site-match">
              <option value="">Use the global setting</option>
              <option value="domain">Base domain</option>
              <option value="host">Host</option>
              <option value="startsWith">Starts with</option>
              <option value="exact">Exact</option>
            </select>
          </label>
        </div>
      </section>
      <input type="text" id="filter" placeholder="Filter all logins…" autocomplete="off" />
      <ul id="list"></ul>
      <div class="error" id="error"></div>
    </main>
    <footer>
      <button class="primary" id="sync">Sync now</button>
      <button id="check-updates" title="Check for a new version of FireSync">Check for updates</button>
      <span class="spacer"></span>
      <button id="options">Settings</button>
    </footer>
    <div class="version">
      <span id="version-line"></span>
      <span class="spacer"></span>
      <span id="update-managed" class="muted"></span>
    </div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
