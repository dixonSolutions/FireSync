<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>FireSync</title>
    <style>
      html, body { margin: 0; height: 100%; background: transparent; }
      button {
        width: 100%; height: 100%; border: 0; padding: 0; cursor: pointer;
        border-radius: 5px; background: linear-gradient(135deg, #ff6b35, #ff3d7f 55%, #9b5de5);
        box-shadow: 0 1px 3px rgba(0,0,0,.25);
      }
      button:focus-visible { outline: 2px solid #9b5de5; outline-offset: 1px; }
      svg { width: 62%; height: 62%; display: block; margin: auto; }
    </style>
  </head>
  <body>
    <button id="open" title="FireSync — fill a saved login" aria-label="FireSync">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M12 3c2.6 3 3.9 5.3 3.9 7a3.9 3.9 0 0 1-7.8 0c0-1.7 1.3-4 3.9-7Z" fill="#fff"/>
        <path d="M6 16.5a6 6 0 0 0 12 0" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </button>
    <script type="module" src="menu-button.js"></script>
  </body>
</html>
