<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>FireSync</title>
    <style>
      html, body { margin: 0; height: 100%; background: transparent; }

      /*
       * The mark is the shipped brand SVG, not a shape drawn here.
       *
       * What was here before was a water droplet with a detached arc beneath
       * it — not the FireSync flame at all — and this button renders at 14-22px,
       * where that 1.8-unit arc on a 24 grid is under a device pixel and reads
       * as a chipped white crescent hanging off the blob.
       *
       * icon-small.svg is the variant that exists for exactly this size range
       * (see the note in it), and it carries its own gradient tile and rounded
       * corners, so there is no second copy of the gradient or the radius here
       * to drift out of step with the rest of the brand.
       */
      #open {
        width: 100%; height: 100%; border: 0; padding: 0; cursor: pointer;
        background: url("icons/icon-small.svg") center / 100% 100% no-repeat;
        filter: drop-shadow(0 1px 2px rgba(0, 0, 0, .35));
      }
      #open:focus-visible { outline: 2px solid #9b5de5; outline-offset: 1px; }
    </style>
  </head>
  <body>
    <button id="open" title="FireSync — fill a saved login" aria-label="FireSync"></button>
    <script type="module" src="menu-button.js"></script>
  </body>
</html>
