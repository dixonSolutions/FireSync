<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="FireSync">
  <title>FireSync — take your Mozilla vault to any Chromium browser</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141419"/>
      <stop offset="1" stop-color="#1E1826"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF6B35" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FF6B35" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#9B5DE5" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#9B5DE5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF8A3D"/>
      <stop offset="0.45" stop-color="#FF3D7F"/>
      <stop offset="1" stop-color="#9B5DE5"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.72" stop-color="#FFD9C2"/>
      <stop offset="1" stop-color="#E6C8FF"/>
    </linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF6B35"/>
      <stop offset="0.5" stop-color="#FF3D7F"/>
      <stop offset="1" stop-color="#9B5DE5"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <circle cx="150" cy="120" r="420" fill="url(#glowA)"/>
  <circle cx="1140" cy="560" r="440" fill="url(#glowB)"/>

  <!-- faint grid, to read as "tooling" rather than "marketing" -->
  <g stroke="#FFFFFF" stroke-opacity="0.045" stroke-width="1">
    <path d="M0 160H1280M0 320H1280M0 480H1280"/>
    <path d="M160 0V640M320 0V640M480 0V640M640 0V640M800 0V640M960 0V640M1120 0V640"/>
  </g>

  <!-- app mark -->
  <g transform="translate(104 186) scale(1.35)">
    <rect width="128" height="128" rx="28" fill="url(#tile)"/>
    <g fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" opacity="0.92">
      <path d="M22.7 49 A44 44 0 0 1 105.3 49"/>
      <path d="M105.3 79 A44 44 0 0 1 22.7 79"/>
    </g>
    <g fill="#FFFFFF" opacity="0.92">
      <polygon points="108.4,57.5 98.7,51.4 111.9,46.6"/>
      <polygon points="19.6,70.5 29.3,76.6 16.1,81.4"/>
    </g>
    <path d="M64 27 C66 40 77 47 80 59 C84 75 75 89 63 89 C51 89 42 78 45 65 C47 57 52 52 56 48 C56 56 59 60 62 62 C60 51 62 39 64 27 Z" fill="#FFFFFF"/>
  </g>

  <g font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
    <text x="330" y="288" fill="url(#word)" font-size="104" font-weight="700" letter-spacing="-3">FireSync</text>
    <text x="334" y="342" fill="#C9C6D6" font-size="27" font-weight="500">Take your Mozilla vault to any Chromium browser.</text>
    <text x="334" y="382" fill="#8E8AA0" font-size="21" font-weight="400">Passwords · autofill · per-site settings — end-to-end encrypted, no server</text>

    <g font-size="19" font-weight="600" fill="#C9C6D6">
      <g transform="translate(334 424)">
        <rect width="124" height="42" rx="21" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.14"/>
        <text x="22" y="27">Chromium</text>
      </g>
      <g transform="translate(474 424)">
        <rect width="104" height="42" rx="21" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.14"/>
        <text x="22" y="27">Chrome</text>
      </g>
      <g transform="translate(594 424)">
        <rect width="94" height="42" rx="21" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.14"/>
        <text x="22" y="27">Brave</text>
      </g>
      <g transform="translate(704 424)">
        <rect width="84" height="42" rx="21" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.14"/>
        <text x="22" y="27">Edge</text>
      </g>
      <g transform="translate(804 424)">
        <rect width="114" height="42" rx="21" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.14"/>
        <text x="22" y="27">Vivaldi</text>
      </g>
  </g>

  <rect x="0" y="626" width="1280" height="14" fill="url(#rail)"/>
</svg>
